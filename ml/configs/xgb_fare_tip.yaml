fare_model:
  n_estimators: 2000
  learning_rate: 0.05
  max_depth: 7
  min_child_weight: 3
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 1.0
  objective: "reg:squarederror"
  eval_metric: "rmse"
  tree_method: "hist"
  n_jobs: 12
  random_state: 42

tip_model:
  n_estimators: 2000
  learning_rate: 0.03
  max_depth: 8
  min_child_weight: 15
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.1
  reg_lambda: 1.0
  objective: "reg:absoluteerror"
  eval_metric: "mae"
  tree_method: "hist"
  n_jobs: 12
  random_state: 42

training:
  early_stopping_rounds: 50
  verbose: 100
  test_size: 0.2
  val_size: 0.1
  sample_pct: 20

features:
  base:
    - trip_distance
    - pu_location_id
    - do_location_id
    - passenger_count
    - ratecode_id
    - hour
    - day_of_week
    - month
    - temperature_f
    - precipitation_mm

  derived:
    - is_rush_hour
    - is_weekend
    - is_raining
    - is_cold

  fare_target: fare_amount
  tip_target: tip_percent
  tip_payment_type: 1

paths:
  fare_model_output: "models/fare_xgb.json"
  tip_model_output: "models/tip_xgb.json"
  fare_metrics_output: "logs/fare_metrics.json"
  tip_metrics_output: "logs/tip_metrics.json"