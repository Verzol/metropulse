model:
  n_estimators: 1500
  learning_rate: 0.05
  max_depth: 6
  min_child_weight: 1
  gamma: 0
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0
  reg_lambda: 1
  objective: "reg:squarederror"
  eval_metric: "rmse"
  tree_method: "hist"
  n_jobs: 2
  random_state: 42
  enable_categorical: true

training:
  early_stopping_rounds: 50
  verbose: 100
  test_size: 0.2
  n_cv_splits: 5
  cv_gap: 24

features:
  base:
    - pu_location_id
    - hour
    - day_of_week
    - month
    - temperature_f
    - precipitation_mm
  derived:
    - "is_weekend"
    - "is_rush_hour"
    - "is_transient_weekend_night"
    - "is_cold"
    - "is_raining"
    - "is_holiday"
    - "demand_lag1h"
    - "demand_lag2h"
    - "demand_lag24h"
    - "demand_lag48h"
    - "demand_lag168h"
    - "demand_vmo_3day"
    - "is_airport"
    - "is_manhattan_core"
    - "airport_rush_hour"
    - "manhattan_weekend"
    - "airport_cold"
    - "manhattan_rain"
  target: demand

paths:
  model_output: "models/demand_xgb.json"
  metrics_output: "logs/demand_metrics.json"