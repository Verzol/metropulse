x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3
  env_file:
    - .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_METADATA_DB_USER:?Set AIRFLOW_METADATA_DB_USER in .env}:${AIRFLOW_METADATA_DB_PASSWORD:?Set AIRFLOW_METADATA_DB_PASSWORD in .env}@airflow-postgres/${AIRFLOW_METADATA_DB_NAME:?Set AIRFLOW_METADATA_DB_NAME in .env}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/New_York
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:?Set AIRFLOW_WEBSERVER_SECRET_KEY in .env}
    AIRFLOW_UID: ${AIRFLOW_UID:-50000}
    METROPULSE_PROJECT_ROOT: /opt/airflow/metropulse
  user: "${AIRFLOW_UID:-50000}:0"
  group_add:
    - "${DOCKER_GID:-109}"
    - "${DOCKER_SOCKET_GID:-65534}"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./:/opt/airflow/metropulse
    - /var/run/docker.sock:/var/run/docker.sock
    - /usr/bin/docker:/usr/bin/docker:ro
    - /usr/lib/docker/cli-plugins:/usr/lib/docker/cli-plugins:ro
    - /usr/libexec/docker/cli-plugins:/usr/libexec/docker/cli-plugins:ro
  depends_on:
    airflow-postgres:
      condition: service_healthy
  networks:
    - metropulse-network

services:
  kafka:
    image: wurstmeister/kafka:latest
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx2G -Xms2G"
    depends_on:
      - zookeeper
    networks:
      - metropulse-network

  zookeeper:
    image: wurstmeister/zookeeper:latest
    ports:
      - "2181:2181"
    environment:
      ZOO_MY_ID: 1
    networks:
      - metropulse-network
  
  minio:
    image: minio/minio:RELEASE.2024-01-31T20-20-33Z
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env
    command: server /data --console-address ":9001"
    networks:
      - metropulse-network
    volumes:
      - minio_data:/data

  spark-master:
    image: apache/spark:3.5.1
    command: "/opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host 0.0.0.0"
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
    networks:
      - metropulse-network

  spark-worker-1:
    image: apache/spark:3.5.1
    command: "/opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker --cores 6 --memory 24G spark://spark-master:7077"
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=24G
      - SPARK_WORKER_CORES=6
    networks:
      - metropulse-network

  spark-worker-2:
    image: apache/spark:3.5.1
    command: "/opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker --cores 6 --memory 24G spark://spark-master:7077"
    depends_on:
      - spark-master
    ports:
      - "8082:8081"
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=24G
      - SPARK_WORKER_CORES=6
    networks:
      - metropulse-network

  airflow-postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${AIRFLOW_METADATA_DB_USER:?Set AIRFLOW_METADATA_DB_USER in .env}
      POSTGRES_PASSWORD: ${AIRFLOW_METADATA_DB_PASSWORD:?Set AIRFLOW_METADATA_DB_PASSWORD in .env}
      POSTGRES_DB: ${AIRFLOW_METADATA_DB_NAME:?Set AIRFLOW_METADATA_DB_NAME in .env}
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 5s
    networks:
      - metropulse-network

  warehouse-postgres:
    image: postgres:15
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${WAREHOUSE_POSTGRES_DB:-metropulse_dw}
      POSTGRES_USER: ${WAREHOUSE_POSTGRES_USER:-metropulse_dw}
      POSTGRES_PASSWORD: ${WAREHOUSE_POSTGRES_PASSWORD:?Set WAREHOUSE_POSTGRES_PASSWORD in .env}
      TZ: America/New_York
      PGTZ: America/New_York
    ports:
      - "${WAREHOUSE_POSTGRES_BIND_ADDRESS:-127.0.0.1}:${WAREHOUSE_POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - warehouse_postgres_data:/var/lib/postgresql/data
      - ./sql/postgres/init_warehouse.sql:/docker-entrypoint-initdb.d/001_init_warehouse.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - metropulse-network

  pgadmin:
    image: dpage/pgadmin4:9.15
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
      PGADMIN_DISABLE_POSTFIX: "1"
    ports:
      - "${PGADMIN_BIND_ADDRESS:-127.0.0.1}:${PGADMIN_HOST_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./config/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      warehouse-postgres:
        condition: service_healthy
    networks:
      - metropulse-network
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        mkdir -p /opt/airflow/logs /opt/airflow/plugins
        chown -R "$${AIRFLOW_UID:-50000}:0" /opt/airflow/logs /opt/airflow/plugins
        airflow db migrate
        airflow users create \
          --username "$${AIRFLOW_ADMIN_USERNAME:-admin}" \
          --firstname Metro \
          --lastname Pulse \
          --role Admin \
          --email "$${AIRFLOW_ADMIN_EMAIL:-admin@example.com}" \
          --password "$${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD in .env}" || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8088:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: metropulse-kafdrop
    ports:
      - "9090:9000"
    depends_on:
      - kafka
    environment:
      KAFKA_BROKERCONNECT: kafka:29092
      JVM_OPTS: "-Xms32M -Xmx64M"
      SERVER_SERVLET_CONTEXTPATH: "/"
    networks:
      - metropulse-network
    restart: on-failure

networks:
  metropulse-network:
    driver: bridge

volumes:
  minio_data:
    driver: local
  airflow_postgres_data:
    driver: local
  warehouse_postgres_data:
    driver: local
  pgadmin_data:
    driver: local
